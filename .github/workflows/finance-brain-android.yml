name: Build Finance Brain APK

on:
  push:
    paths: ["finance-brain/**"]
  pull_request:
    paths: ["finance-brain/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: finance-brain }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: finance-brain-debug-apk
          path: finance-brain/app/build/outputs/apk/debug/app-debug.apk
